status:
  scope: >-
    Thirty-nine compared theorems over eight compared definitions (namespace GrahamLPT): loads before an index and
    in full, the makespan, the optimal makespan, list schedules in the index order under every tie-breaking, LPT
    schedules as list schedules of some nonincreasing order, Graham's family and the unit-job family. The elementary
    facts (8): list and LPT schedules exist, the optimum is at most every makespan and is attained, every load, every
    job and the average load are at most the makespan, relabeling the jobs preserves the makespan. Graham 1966 (5):
    m * C(sigma) <= (2m - 1) * C(tau) for every list schedule sigma and assignment tau, the ratio form against the
    optimum, the unit-job family's optimum m and list-schedule makespan 2m - 1, and 2 - 1/m as the least constant.
    Graham 1969 (9): 3m * C(sigma) <= (4m - 1) * C(tau) for every LPT schedule sigma and assignment tau, the ratio
    form, the optimality of LPT when every job exceeds a third of the makespan of tau and of the optimum, Graham's
    family in nonincreasing order with optimum 3m attained by a list schedule and LPT makespan 4m - 1 for every m,
    and 4/3 - 1/(3m) as the least constant. The optimum over lists (2): every assignment is matched or improved by
    a list schedule in the order of its start times, so Graham's omega_0 equals optMakespan (IsLeast). The third
    cannot be weakened (3): on three machines 9, 5, 5, 4, 4, 4 has an LPT schedule of makespan 13 and optimum 12, each job at least
    a third of 12. The position of a job on its machine (2): Chen's property (c + 1) p_k <= C(tau) for the
    (c + 1)-th job k on a machine of a list schedule of a nonincreasing p, and the Coffman-Sethi form
    q m C(sigma) <= ((q + 1) m - 1) C(tau) for a machine with q jobs attaining the makespan of an LPT schedule.
    The critical job (4): for a job k completing at the makespan of a list schedule of a nonincreasing p, the smaller
    of C(sigma) and 3 p_k is at most C(tau) for every tau; C(sigma) <= 3 p_k certifies optimality; equality
    3m C(sigma) = (4m - 1) C(tau) on m >= 2 machines forces 3 p_k = C(tau), equal loads before k, every load of tau
    equal to C(tau) and no positive job after k; and Della Croce-Scatamacchia's Proposition 4, q (m - 1) C(sigma) <=
    ((q + 1)(m - 1) - 1) C(tau) when another machine holds q jobs before k and q + 2 <= m. Dósa's theorem (5):
    every positive multiple of Graham's instance in any order attains the bound; conversely, for positive lengths on
    m >= 2 machines, a list schedule of a nonincreasing instance, or an LPT schedule of any instance, attains the
    bound against the optimum only when the instance is a positive multiple of Graham's 2m + 1 jobs (the sorted form
    with n = 2m + 1 and Fin.cast, the LPT form with an equivalence Fin n ~ Fin (2m + 1)), the two-way statement, and
    the strict inequality for every number of jobs other than 2m + 1. The fixed number of jobs (1): for every
    n >= 2m + 1, 4/3 - 1/(3m) is the supremum (IsLUB) of C(sigma)/optMakespan over the LPT schedules of the positive
    instances with n jobs (Graham's jobs followed by n - 2m - 1 jobs of a common small length approach it).
    All proved; no sorry, no axiom beyond propext, Classical.choice and
