automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)", "GPT (OpenAI)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout: the
        reading of Graham's papers as printed pages, the statements and their check against them, the exact replay of
        the finite facts in the standard library, the Lean proofs, the prior-art searches and the repository text,
        by the Claude Fable 5.1 session that directed the work (the statements, the exact probe, the documents) and
        Claude Opus 5.5 subagents (the proofs, the reading passes, the audits) in Claude Code, with the proofs audited
        in separate passes. Lean v4.35.0-rc2 and Mathlib v4.35.0-rc2 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55) are
        pinned by the committed manifest and lake update is never run; there are no GitHub Actions workflows. There
        is no native_decide and no decide +kernel: the proofs are Finset arithmetic over the reals and the natural
        numbers (fibers of assignments, sums over them, cardinalities), closed by linarith, omega, simp and ring.
        GPT (OpenAI) was used once, for a pre-submission consult on the tree at bbb9373 (11 October 2026); its
        proposals were checked here before adoption.
  spend_usd: "not tracked"

fidelity:
  divergences: >-
    Job lengths are real numbers, nonnegative where a bound is stated (Graham 1969 takes positive lengths, 1966
    nonnegative ones); the number of
    machines m is a natural number with the typeclass hypothesis NeZero m. An assignment is a function from job
    indices to machine indices (Fin n -> Fin m); the load of a machine is the sum of the lengths assigned to it,
    with no idle time and no start times, which is the makespan model for independent tasks; the optimal makespan
    optMakespan m p is the least makespan over all m^n assignments, a minimum over finitely many values. A list
    schedule in the index order (IsListSchedule) is an assignment that sends every job k to a machine whose load from
    the jobs of index below k is least, under any tie-breaking; this is Graham's event-driven rule for independent
    tasks (a free processor takes the next task of the list), stated as a relation rather than as the procedure with
    his lowest-index tie rule, so every theorem quantifies over every tie-breaking. An LPT schedule (IsLPTSchedule)
    is an assignment sigma for which some permutation pi of the indices makes p o pi nonincreasing and sigma o pi a
    list schedule of p o pi. Graham's omega_0 is the least finishing time over all lists; optMakespan is the least
    over all assignments; the two are equal (exists_listSchedule_le, isLeast_listSchedule_makespan), so the bounds
    here, stated against every assignment, are his, with nonnegative lengths and every tie-breaking as the only
    widening; for his instance the optimum 3m is attained by an explicit list schedule. The bounds are
    stated division-free (3m * C(sigma) <= (4m - 1) * C(tau)) and in ratio form against optMakespan with real
    division. Graham's instance (grahamJobs) is indexed from 0: job j < 2m has length 2m - 1 - floor(j/2) and job 2m
    has length m, which is his alpha_k = 2n - floor((k + 1)/2) for k = 1..2n and alpha_{2n+1} = n; its lengths are
    naturals cast to the reals. The unit-job family is m(m - 1) jobs of length 1 followed by one of length m, indexed
    by Fin (m * (m - 1) + 1); for m = 1 both families degenerate (three jobs of length 1; one job of length 1) and
    the theorems hold there with the bounds equal to 1. The optimality theorem is stated with every job longer than
    a third of the makespan of the comparison assignment, and of the optimum; the hypothesis is a strict inequality.
    The IsLeast statements range over every number of jobs n, every nonnegative instance on m machines, every list
    (resp. LPT) schedule and every assignment. The critical job is a job k with loadBefore p sigma k (sigma k) + p k
    equal to the makespan (a hypothesis, not a construction). Dósa's theorem is stated for strictly positive lengths
    (a zero job appended to Graham's instance keeps the ratio; replayed, not formalized), with m >= 2 (on one machine every instance has ratio
    1) and with at least one job; "the instance is Graham's" means p j = a * grahamJobs m (e j) for some a > 0 and
    some equivalence e : Fin n ~ Fin (2m + 1) (in the sorted form, n = 2m + 1 and e is Fin.cast). The supremum for a
    fixed number of jobs is an IsLUB statement over the set of real ratios C(sigma)/optMakespan of the LPT schedules
    of positive instances with exactly n jobs; attainment is the separate strict inequality for n != 2m + 1.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents wrote the proofs and
    audited them in separate passes, the statements were checked against the printed pages of the texts read (Graham
    1966, Graham 1972, Lenstra-Shmoys, Della Croce-Scatamacchia, Dósa 2004) by a separate reading pass, the finite facts behind every statement are replayed exactly by scripts/check_lpt.py in
    the standard library, and VERIFICATION.md states what is checked and what is not. Mechanical correctness and
    agreement of formal statements do not establish significance: the bounds and both instances are Graham's; what this development adds is the relation form over every tie-breaking,
    the counting proof of the key step in place of the exchange argument, the IsLeast forms, the optimality theorem
    as a statement with its witness instance, the equality of the optimum over lists with the optimum over
    assignments, the explicit list attaining the optimum of Graham's instance, and the pair-of-machines invariant
    behind Chen's property (Chen's and Coffman-Sethi's papers were not read; their statements are taken from Della
    Croce-Scatamacchia 2020), the critical job's certificates, the counting proof of Dósa's theorem with its
    hypotheses made explicit, and the supremum for a fixed number of jobs. The dated searches
    (formalization.yaml's description names them) found no earlier kernel check of the 4/3 - 1/(3m) bound or of
    either equality family; the Isabelle AFP holds a 3/2 bound for sorted greedy, and two Lean repositories hold the
    2 - 1/m list-scheduling bound over lists of naturals.

alignment:
  namespace: "GrahamLPT"
  statements:
    - source: "This development (the greedy construction; Graham 1966, Section 1.1, the rule)"
      lean: "GrahamLPT.exists_isListSchedule"
      module: "Solution"
      status: "proved"
      note: "A list schedule exists (the lowest-index tie-breaking, for instance)."
    - source: "This development (a list schedule of a nonincreasing order; Graham 1969, Section 5, the rule)"
      lean: "GrahamLPT.exists_isLPTSchedule"
      module: "Solution"
      status: "proved"
      note: "An LPT schedule exists."
    - source: "This development (the optimum is a minimum over assignments)"
      lean: "GrahamLPT.optMakespan_le"
      module: "Solution"
      status: "proved"
      note: "The optimal makespan is at most the makespan of every assignment."
    - source: "This development (the minimum over finitely many assignments is attained)"
      lean: "GrahamLPT.exists_makespan_eq_optMakespan"
      module: "Solution"
      status: "proved"
      note: "The optimal makespan is attained."
    - source: "This development"
      lean: "GrahamLPT.load_le_makespan"
      module: "Solution"
      status: "proved"
      note: "Every machine load is at most the makespan."
    - source: "This development (the standard lower bound; Lenstra-Shmoys, Chapter 9, inequality (9.1)'s ingredients)"
      lean: "GrahamLPT.le_makespan_of_nonneg"
      module: "Solution"
      status: "proved"
      note: "For nonnegative lengths every job is at most the makespan."
    - source: "This development (the standard lower bound: the average load)"
      lean: "GrahamLPT.sum_le_mul_makespan"
      module: "Solution"
      status: "proved"
      note: "The total length is at most `m` times the makespan."
    - source: "This development (relabeling the jobs)"
      lean: "GrahamLPT.makespan_comp"
      module: "Solution"
      status: "proved"
      note: "Relabeling the jobs by a permutation changes neither the loads nor the makespan."
    - source: "Graham 1966, the Theorem of Section II for the same number of processors and no precedence constraints (Graham 1972, (1)-(2), p. 208), against every assignment (this development's form)"
      lean: "GrahamLPT.listSchedule_bound"
      module: "Solution"
      status: "proved"
      note: "Graham's bound for list scheduling: for nonnegative lengths, every list schedule `σ` and every assignment `τ` satisfy `m · C(σ) ≤ (2m − 1) · C(τ)`."
    - source: "Graham 1966, the Theorem for the same number of processors; the ratio form"
      lean: "GrahamLPT.listSchedule_le_optMakespan"
      module: "Solution"
      status: "proved"
      note: "Every list schedule is within the factor `2 − 1/m` of the optimum."
    - source: "Graham 1972, p. 209, the example of his (3) at k = 0 (m(m - 1) unit jobs and one job of length m): omega_0 = n; Lenstra-Shmoys, Chapter 9, p. 188"
      lean: "GrahamLPT.unitJobs_optMakespan"
      module: "Solution"
      status: "proved"
      note: "The `m(m − 1)` unit jobs with one job of length `m` have optimal makespan `m`."
    - source: "Graham 1972, p. 209, the example of his (3) at k = 0: omega(0) = 2n - 1 for the list with the long task last; every list schedule in that order, every tie-breaking (this development); Lenstra-Shmoys, Chapter 9, p. 188"
      lean: "GrahamLPT.unitJobs_listSchedule_makespan"
      module: "Solution"
      status: "proved"
      note: "Every list schedule of the unit jobs followed by the job of length `m` has makespan `2m − 1`."
    - source: "This development (the least constant, from the bound and the family)"
      lean: "GrahamLPT.isLeast_listSchedule_ratio"
      module: "Solution"
      status: "proved"
      note: "`2 − 1/m` is the least constant `c` with `C(σ) ≤ c · C(τ)` for every list schedule `σ` of every nonnegative instance on `m` machines and every assignment `τ`."
    - source: "Graham 1969, Theorem 2 (omega_L / omega_0 <= 4/3 - 1/(3n)); restated as (6) in Graham 1972, p. 209; against every assignment and under every tie-breaking (this development's form); announced in Graham 1966, Section III"
      lean: "GrahamLPT.lpt_bound"
      module: "Solution"
      status: "proved"
      note: "Graham's bound for LPT: for nonnegative lengths, every LPT schedule `σ` and every assignment `τ` satisfy `3m · C(σ) ≤ (4m − 1) · C(τ)`."
    - source: "Graham 1969, Theorem 2; the ratio form"
      lean: "GrahamLPT.lpt_le_optMakespan"
      module: "Solution"
      status: "proved"
      note: "Every LPT schedule is within the factor `4/3 − 1/(3m)` of the optimum."
    - source: "This development (the case of Graham 1969's proof in which every task exceeds a third of the optimum, stated as a theorem)"
      lean: "GrahamLPT.lpt_optimal_of_third_lt"
      module: "Solution"
      status: "proved"
      note: "When every job is longer than a third of the makespan of `τ`, every LPT schedule is at least as good as `τ`."
    - source: "This development (LPT is optimal when every job exceeds a third of the optimum)"
      lean: "GrahamLPT.lpt_eq_optMakespan_of_third_lt"
      module: "Solution"
      status: "proved"
      note: "LPT is optimal when every job is longer than a third of the optimal makespan."
    - source: "Graham 1969, pp. 425-426, and Graham 1972, p. 209 (the example alpha_k = 2n - [(k + 1)/2], alpha_{2n+1} = n, in nonincreasing order)"
      lean: "GrahamLPT.grahamJobs_antitone"
      module: "Solution"
      status: "proved"
      note: "Graham's instance is listed in nonincreasing order."
    - source: "Graham 1969, pp. 425-426, and Graham 1972, p. 209, Figure 15 (omega_0 = 3n for the example)"
      lean: "GrahamLPT.grahamJobs_optMakespan"
      module: "Solution"
      status: "proved"
      note: "Graham's instance has optimal makespan `3m`."
    - source: "Graham 1969, pp. 425-426, and Graham 1972, p. 209, Figure 15 (omega_0 is attained by an optimal list; the explicit order is this development's)"
      lean: "GrahamLPT.grahamJobs_exists_optimal_listSchedule"
      module: "Solution"
      status: "proved"
      note: "The optimum `3m` of Graham's instance is attained by a list schedule, in the order `2m − 1, …, m + 1, m, m, 2m − 1, …, m + 1, m`."
    - source: "Graham 1969, pp. 425-426, and Graham 1972, p. 209, Figure 14 (omega* = 4n - 1 for the example), for every n and every tie-breaking (this development)"
      lean: "GrahamLPT.grahamJobs_lpt_makespan"
      module: "Solution"
      status: "proved"
      note: "Every LPT schedule of Graham's instance has makespan `4m − 1`: the bound `4/3 − 1/(3m)` is attained for every `m`."
    - source: "Graham 1969, Theorem 2 ('this bound is best possible'), in the IsLeast form"
      lean: "GrahamLPT.isLeast_lpt_ratio"
