      note: "The optimal makespan is the least makespan over the list schedules in all orders: Graham's `ω₀`, the least finishing time over all lists, equals the optimum over all assignments."
    - source: "This development (the instance 9, 5, 5, 4, 4, 4 on three machines; cf. Spencer's 6, 3, 3, 2, 2, 2 in Graham 1972, Figure 16)"
