      note: "`4/3 − 1/(3m)` is the least constant `c` with `C(σ) ≤ c · C(τ)` for every LPT schedule `σ` of every nonnegative instance on `m` machines and every assignment `τ`."
    - source: "This development (Graham's omega_0, the least finishing time over lists, is attained: every assignment is matched or improved by a list schedule in the order of its start times; Graham 1972, p. 209, takes omega_0 as the optimum over lists)"
