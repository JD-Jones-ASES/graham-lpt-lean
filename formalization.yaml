      the convention of Section 3 that the critical job is the last one (j' = n), p. 4; Proposition 4, "If LPT
      schedules at least k jobs on a non critical machine before assigning the critical job, then r^LPT <= (k + 1)/k -
      1/(k(m - 1)) for m >= k + 2", proved by a linear program and its dual, pp. 4-6; the summary that under the
      convention the ratio is at most 4/3 - 1/(3(m - 1)) for m >= 3 and n != 2m + 1, pp. 8-9; the reference list,
      pp. 25-27, without Dósa 2004. The journal print was not read; its reference list (Crossref, 32 items) adds
      Dósa 2004, labelled "(in Hungarian)" there, though the paper is in English.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The read restatement of Chen's property, Proposition 2 (4), proved here as lpt_job_position_le, and of the
      Coffman-Sethi form, Proposition 3 (6), proved here as lpt_bound_of_card, both by this development's own argument;
      lpt_bound_of_other_card is Proposition 4 with q for k, the ratio against C* read as the inequality against every
