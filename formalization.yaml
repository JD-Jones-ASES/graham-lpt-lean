  - title: "Bounds on multiprocessing anomalies and related packing algorithms"
    authors: ["R. L. Graham"]
    id: "doi:10.1145/1478873.1478901"
    type: "paper"
    location: >-
      AFIPS Conference Proceedings 40, Spring Joint Computer Conference (1972), 205-217 (the ACM Digital Library entry
      under this DOI files it as the 1971 Fall Joint Computer Conference; the scan's running head reads Spring Joint
      Computer Conference, 1972). Read as printed pages: the tie rule, p. 206; the bounds (1)-(2), p. 208; the theorem (3)
      on the k largest tasks with its example, pp. 208-209; the decreasing list, the bound (6) and both examples, p. 209;
      Spencer's example, Figure 16, p. 210.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Graham's own restatement of both theorems with the examples, read in full for this entry (the 1969 paper itself was
      not obtainable on 2026-10-11). p. 206: a task two free processors both attempt is assigned to the one with the
      smaller index. p. 208: omega'/omega <= 1 + (n - 1)/n', and 2 - 1/n for n = n'. pp. 208-209, (3): scheduling the k
      largest tasks optimally first, with the example mu(T_i) = n for i <= k + 1 and 1 for k + 2 <= i <= k + 1 + n(n - 1),
      omega(k) = k + 2n - 1, omega_0 = k + n; at k = 0 this is the unit-job family of unitJobs_optMakespan and
      unitJobs_listSchedule_makespan. p. 209, (6): omega*/omega_0 <= 4/3 - 1/(3n) for the decreasing list L* (any
      nonincreasing order), "This bound is best possible", the n = 2 example 3, 3, 2, 2, 2 of ratio 7/6, and the general
      example alpha_k = 2n - [(k + 1)/2] (1 <= k <= 2n), alpha_{2n+1} = n, that is (2n - 1, 2n - 1, ..., n + 1, n + 1, n, n, n),
      run by the decreasing list (Figure 14) and by an optimal list (Figure 15), with no parity condition: grahamJobs.
      p. 210, Figure 16: J. H. Spencer's (6, 3, 3, 2, 2, 2) on three processors, the decreasing list not optimal (not formalized here; 9, 5, 5, 4, 4, 4 plays its role). The
      bounds are attributed there to the 1966 paper (reference 19) and the 1969 paper (reference 20). The proofs here
      are not his.

