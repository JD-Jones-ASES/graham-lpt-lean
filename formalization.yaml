      paper itself was not read.
  - title: "The Longest Processing Time rule for identical parallel machines revisited"
    authors: ["Federico Della Croce", "Rosario Scatamacchia"]
    id: "doi:10.1007/s10951-018-0597-6"
    type: "paper"
    location: >-
      Journal of Scheduling 23 (2) (2020), 163-176 (online 18 December 2018); read as arXiv:1801.05489v1
      (https://arxiv.org/abs/1801.05489), the only arXiv version: Section 2, Propositions 1-3 (the bounds (1)-(3),
