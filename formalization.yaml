      weaker (k + 1)/k - 1/(km), not by their linear program. The survey's other statements are not formalized.
  - title: "Graham's example is the only tight one for P || Cmax"
    authors: ["György Dósa"]
    id: "https://annales-math.elte.hu/annales47-2004/Annales_Universitatis_Scientiarum_Budapestinensis_de_Rolando_Eotvos_nominatae_Sectio_Mathematica_2004_TOMUS_XLVII.pdf"
    type: "paper"
    location: >-
      Annales Universitatis Scientiarum Budapestinensis de Rolando Eötvös Nominatae, Sectio Mathematica 47 (2004),
      207-210 (received December 20, 2004; in English; no DOI), read in the journal's volume PDF, whose pages 207-210
      are the printed pages: the performance ratio R_m(A) as a supremum, Theorem 1 (R_m(LPT) = (4m - 1)/(3m), from
      Graham 1969) and Graham's instance T* = {2m - 1, 2m - 1, ..., m + 1, m + 1, m, m, m} with optimum 3m and LPT
      makespan 4m - 1, p. 208; Theorem 2, "Let T != T*. Then C_LPT(T)/C*(T) < (4m - 1)/(3m)", p. 208; Remark 1,
      R_{m,n}(LPT) over the instances with n jobs "is strictly less than (4m - 1)/(3m), if n != 2m + 1", stated without
      proof, p. 208; Definitions 1-3 (the (p/q) counterexample, the moment * before the last job, the regular schedule)
      and Lemmas 1-2, p. 209; the proof of Theorem 2 (with q = 3m and p = 4m - 1: T_n = m, every load 3m - 1 at *,
      every optimal load 3m, a triple of jobs of length m, and the alternation of the two pairings), p. 210.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      graham_of_listSchedule_eq_bound, graham_of_lpt_eq_bound and lpt_eq_bound_iff_graham are his Theorem 2 with what
      its proof uses made explicit: "T != T*" read up to a positive scale and the order of the jobs (his proof treats
      the optimum 3m), positive real lengths, m >= 2 (his Lemma 1 assumes it; on one machine every instance has ratio
      1 = (4 - 1)/3), and every tie-breaking; lpt_eq_bound_of_graham is the p. 208 computation for every positive
      multiple of the instance in every order; lpt_lt_bound_of_card_ne is the corollary of Theorem 2 for n != 2m + 1.
      His Remark 1 asserts more, that the supremum over the instances with n jobs is below the ratio for every
      n != 2m + 1; isLUB_lpt_ratio_of_card shows that for every n >= 2m + 1 the supremum is the ratio (Graham's jobs
      followed by small jobs), so the remark holds at most for n < 2m + 1, which is not formalized here. The proof
      here counts the jobs of each machine in the two schedules; it is not his minimal-counterexample argument.
  - title: "Verified Approximation Algorithms"
