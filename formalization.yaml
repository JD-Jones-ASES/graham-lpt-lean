  arxiv: ["cs.DS"]
  msc2020: ["90B35", "68W25", "68Q25"]


sources:
  - title: "Bounds on multiprocessing timing anomalies"
    authors: ["R. L. Graham"]
    id: "doi:10.1137/0117039"
    type: "paper"
    location: >-
      SIAM Journal on Applied Mathematics 17 (2) (March 1969), 416-429 (Crossref). Read on 2026-10-09 from the
      author's scan https://mathweb.ucsd.edu/~ronspubs/69_02_multiprocessing.pdf (also at
      https://fanchung.ucsd.edu/ron/papers/69_02_multiprocessing.pdf); the host reset every connection on 2026-10-11,
      so the locators are those of that reading, with both theorems checked against his 1972 restatement (p. 209,
      reference 20): the tie convention (the lower-indexed processor), Section 2; tasks with mu: T -> (0, infinity) and the LPT rule,
      Section 5, p. 421; Theorem 2, omega_L/omega_0 <= 4/3 - 1/(3n), "best possible", p. 421; the instance of 2n + 1 tasks
      alpha_k = 2n - [(k + 1)/2] (k = 1, ..., 2n), alpha_{2n+1} = n, with omega_L = 4n - 1 and omega_0 = 3n, pp. 425-426,
      no parity condition on n; the proof's case alpha_r > omega_0/3, in which every optimal schedule runs at most two
      tasks per processor, pp. 421-425 (the reading of 2026-10-09).
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      lpt_bound and lpt_le_optMakespan are Theorem 2 with n processors read as m machines, nonnegative lengths in place
      of positive ones, every tie-breaking in place of the lower-index rule, and the optimum over assignments, which
      equals his omega_0, the least finishing time over lists (exists_listSchedule_le, isLeast_listSchedule_makespan),
      so the statements are his with nonnegative lengths and every tie-breaking as the only widening;
      grahamJobs_antitone, grahamJobs_optMakespan and grahamJobs_lpt_makespan are his instance of pp. 425-426 for every
      m >= 1 (grahamJobs m at index j is alpha_{j+1}). The proof here is not his exchange argument (see PROOF.md).
  - title: "Bounds for certain multiprocessing anomalies"
    authors: ["R. L. Graham"]
    id: "doi:10.1002/j.1538-7305.1966.tb01709.x"
    type: "paper"
    location: >-
      Bell System Technical Journal 45 (9) (November 1966), 1563-1581: tasks with mu: T -> [0, infinity) and the
      lower-index tie convention, Section 1.1, pp. 1563-1564; the Theorem omega'/omega <= 1 + (n - 1)/n', p. 1570, its
      proof (7)-(10), pp. 1570-1571 (the introduction, p. 1567, cites it as "Theorem, p. 1571"); Example 5 (L varied,
      n = n', 2n - 1 tasks: n - 1 of length 1, n - 1 of length n - 1, one of length n; omega = n, omega' = 2n - 1),
      pp. 1571-1573; Section III, p. 1581: with an empty partial order the longest-chain rule satisfies
      omega*/omega_0 <= 4/3 - 1/(3n), "which, again, is best possible", omega_0 minimized over all lists, the proof
      deferred to "a later paper" (footnote).
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      listSchedule_bound and listSchedule_le_optMakespan are the Theorem with n = n', mu = mu' and no precedence
      constraints, with the second execution replaced by an arbitrary assignment tau: the proof uses only
      omega >= (1/n) sum mu (9) and omega >= the longest task (10), which every assignment satisfies. The unit-job
      instance of unitJobs_* is not in this paper (his Example 5 is a different instance); it is in his 1972 survey.
      Section III announces the bound of the 1969 paper.
  - title: "Elements of Scheduling"
